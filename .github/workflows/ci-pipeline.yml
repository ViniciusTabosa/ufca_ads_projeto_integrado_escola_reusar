name: Esteira de integração Escola Reusar (CI)

on:
  push:
    branches:
      -main

  pull_request:
    branches:
      -main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o codigo fonte
        uses: actions/checkout@v3
      
      - name: 2. Configurar o ambiente python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: 4. Validacao Estatica (Lint com Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5. Rodar Testes Automatizados (Pytest)
        run: |
          pytest -v

      - name: 6. Testar o Build do Docker
        run: |
          docker build -t fastorder-api-test .              

