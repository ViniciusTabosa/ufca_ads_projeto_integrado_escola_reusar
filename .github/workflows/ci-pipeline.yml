name: Esteira de integração Escola Reusar (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  VERSAO_PYTHON: "3.11"
  NOME_VERSAO: "1.0.0"
  ENV_NAME: "producao"

jobs:
  lint-and-test:
    name: Qualidade e Testes Funcionais
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Baixar o código fonte
        uses: actions/checkout@v3
      
      - name: 1.2 Configurar Python ${{ env.VERSAO_PYTHON }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      - name: 1.3 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: 1.4 Lint com Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 1.5 Rodar Testes Automatizados (Pytest)
        run: |
          pytest -v

  security-scans:
    name: 2. Escaneamento de Segurança
    runs-on: ubuntu-latest
    steps:
      - name: 2.1 Baixar código fonte
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 2.2 Configurar Python ${{ env.VERSAO_PYTHON }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      - name: 2.3 Instalar dependências e ferramentas de SAST/SCA
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit pip-audit

      - name: 2.4 Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: 2.5 SAST - Análise Estática com o Bandit
        run: |
          bandit -r .-lll

      - name: 2.6 SCA - Análise de Dependências com o Pip Audit
        run: |
          pip-audit -r requirements.txt

  docker-build-and-scan:
    name: 3. Build Docker e Scan Trivy
    needs: [lint-and-test, security-scans]
    runs-on: ubuntu-latest
    steps:
      - name: 3.1 Baixar código Fonte
        uses: actions/checkout@v3

      - name: 3.2 Build da Imagem Docker Local
        run: |
          docker build -t app:test .

      - name: 3.3 Escaneamento de vulnerabilidades da Imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'