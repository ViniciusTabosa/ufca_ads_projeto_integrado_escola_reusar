<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Escola Reusar</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login-cadastro.css">
</head>

<body>

    <header>

        <div class="logo">

            <!-- LOGO DO PROJETO -->
            <img src="../imgs/logo.png" alt="Logo Escola Reusar">

            <h1>Escola Reusar</h1>

        </div>

        <nav class="menu-logado menu">
            <input type="checkbox" class="menu-faketrigger">

            <div class="menu-lines">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul>
                <li><a href="login.html">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <div class="container">

            <section class="formulario">

                <h2>Entrar na sua conta</h2>

                <p>Digite suas informações abaixo para fazer login.</p>

                <form action="/login" method="post">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                    <button type="submit">Entrar</button>

                </form>

            </section>

            <aside class="ilustracao">

                <!-- ILUSTRAÇÃO DA TELA DE LOGIN -->
                <img src="../imgs/img_login.png">

            </aside>

        </div>

    </main>

    <footer>
        <p>Code by: <a href="https://github.com/ViniciusTabosa/ufca_ads_escolar_reusar_front-end" target="_blank">PISociety</a></p>
    </footer>

</body>

</html>
